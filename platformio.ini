; sensor-reader — unified ESP32 firmware (Arduino framework)
; Production: sensor_hub | Smoke tests: temp_ds18b20, pms5003, sht31d

[platformio]
default_envs = sensor_hub

[env:sensor_hub]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<../apps/sensor_hub/>
; Local lib/ drivers (ds18b20, pms5003, sht31d, telemetry_json, cdc_serial)
; are resolved automatically from the default lib_dir = lib convention.
; Vendored snapshots (OneWire, DallasTemperature, AUnit) come from lib_extra_dirs.
lib_deps =
  milesburton/DallasTemperature
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit BusIO
lib_extra_dirs = libraries
monitor_speed = 115200

[env:temp_ds18b20]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<../apps/temp_ds18b20/>
lib_deps =
  milesburton/DallasTemperature
lib_extra_dirs = libraries
monitor_speed = 115200

[env:pms5003]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<../apps/pms5003/>
lib_extra_dirs = libraries
monitor_speed = 115200

[env:sht31d]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<../apps/sht31d/>
lib_deps =
  adafruit/Adafruit SHT31 Library
